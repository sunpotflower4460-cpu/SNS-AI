name: SNS Engagement Control

on:
  workflow_dispatch:
    inputs:
      account:
        description: Account ID from config/accounts.json
        required: true
        type: string
      action:
        description: Engagement lifecycle action. Manual-Only blocks activation until runtime policy is reviewed.
        required: true
        default: deactivate
        type: choice
        options: [activate, deactivate]

permissions:
  contents: write

concurrency:
  group: sns-ai-write
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-latest
    env:
      INPUT_ACCOUNT: ${{ inputs.account }}
      INPUT_ACTION: ${{ inputs.action }}

    steps:
      - name: Authorize command actor
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          EXTRA_ADMINS: ${{ vars.SNS_COMMAND_ADMINS }}
        shell: bash
        run: |
          normalized=",$(printf '%s' "${EXTRA_ADMINS:-}" | tr -d ' '),"
          if [[ "$ACTOR" != "$OWNER" && "$normalized" != *",$ACTOR,"* ]]; then
            echo "::error::Actor '$ACTOR' is not authorized to change live engagement state."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Validate control inputs
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const account = String(process.env.INPUT_ACCOUNT || '').trim();
          const action = String(process.env.INPUT_ACTION || '').trim();
          if (!/^[A-Za-z0-9_.-]{1,80}$/.test(account)) throw new Error('A valid account id is required.');
          if (!['activate', 'deactivate'].includes(action)) throw new Error('Unsupported engagement action.');
          NODE

      - name: Runtime static guards
        run: |
          npm run validate
          npm run check
          npm run secret-scan
          npm run manual-only-audit

      - name: Verify every activation gate
        if: inputs.action == 'activate'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SOCIAL_CREDENTIALS_JSON: ${{ secrets.SOCIAL_CREDENTIALS_JSON }}
          X_OAUTH2_STATE_KEY: ${{ secrets.X_OAUTH2_STATE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SNS_REQUIRE_DURABLE_STATE: 'true'
        shell: bash
        run: |
          set -o pipefail
          npm run doctor -- --strict --account "$INPUT_ACCOUNT"
          node src/ops/live-preflight.mjs --account "$INPUT_ACCOUNT" --engagement
          node src/ops/x-automation-compliance.mjs --account "$INPUT_ACCOUNT"

      - name: Apply activation
        if: inputs.action == 'activate'
        run: node src/engagement/activate.mjs --account "$INPUT_ACCOUNT" --activate

      - name: Apply deactivation
        if: inputs.action == 'deactivate'
        run: node src/engagement/activate.mjs --account "$INPUT_ACCOUNT" --deactivate

      - name: Validate changed configuration
        run: |
          npm run validate
          npm run manual-only-audit

      - name: Persist engagement control state
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- config/accounts.json config/engagement-policy.json)" ]]; then
            echo "No engagement control changes."
            exit 0
          fi
          git config user.name "sns-ai-bot"
          git config user.email "sns-ai-bot@users.noreply.github.com"
          git add config/accounts.json config/engagement-policy.json
          git commit -m "config: engagement ${INPUT_ACTION} ${INPUT_ACCOUNT}"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 3))
          done
          exit 1

      - name: Report result
        if: success()
        run: echo "SNS-AI engagement '$INPUT_ACTION' request completed for '$INPUT_ACCOUNT' after safety gates."

name: Publish social post

on:
  workflow_dispatch:
    inputs:
      account:
        description: Account ID from config/accounts.json
        required: true
        type: string
      text:
        description: Post text/caption
        required: false
        type: string
      media_url:
        description: Public HTTPS media URL (required by Instagram)
        required: false
        type: string
      media_type:
        description: image or reel
        required: false
        default: image
        type: choice
        options: [image, reel]
      dry_run:
        description: Validate without publishing
        required: false
        default: true
        type: boolean
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: sns-ai-write
  cancel-in-progress: false

jobs:
  publish:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'opened' && startsWith(github.event.issue.title, '[publish]')) ||
      (github.event.action == 'labeled' &&
       startsWith(github.event.issue.title, '[approval]') &&
       github.event.label.name == 'approved')
    runs-on: ubuntu-latest
    env:
      SOCIAL_CREDENTIALS_JSON: ${{ secrets.SOCIAL_CREDENTIALS_JSON }}
      X_OAUTH2_STATE_KEY: ${{ secrets.X_OAUTH2_STATE_KEY }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Authorize command actor
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          EXTRA_ADMINS: ${{ vars.SNS_COMMAND_ADMINS }}
        shell: bash
        run: |
          normalized=",$(printf '%s' "${EXTRA_ADMINS:-}" | tr -d ' '),"
          if [[ "$ACTOR" != "$OWNER" && "$normalized" != *",$ACTOR,"* ]]; then
            echo "::error::Actor '$ACTOR' is not authorized to publish. Owner '$OWNER' or SNS_COMMAND_ADMINS is required."
            exit 1
          fi

      - uses: actions/checkout@v7
        id: checkout
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build payload
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_ID: ${{ github.run_id }}
          INPUT_ACCOUNT: ${{ inputs.account }}
          INPUT_TEXT: ${{ inputs.text }}
          INPUT_MEDIA_URL: ${{ inputs.media_url }}
          INPUT_MEDIA_TYPE: ${{ inputs.media_type }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';

          let payload;
          if (process.env.EVENT_NAME === 'issues') {
            try {
              payload = JSON.parse(process.env.ISSUE_BODY || '');
            } catch {
              throw new Error('SNS command issue body must be valid JSON.');
            }
            if ((process.env.ISSUE_TITLE || '').startsWith('[approval]')) {
              if (process.env.ISSUE_AUTHOR !== 'github-actions[bot]') throw new Error('Approval issues must be created by github-actions[bot].');
              if (!payload.account || !payload.slotId) throw new Error('Approval issue payload must contain account and original slotId.');
              const marker = payload._snsAi;
              if (marker?.kind !== 'sns-ai-approval' || Number(marker?.version) !== 1
                || String(marker?.account) !== String(payload.account)
                || String(marker?.slotId) !== String(payload.slotId)) {
                throw new Error('Approval issue is missing a valid SNS-AI provenance marker.');
              }
              const expectedTitle = `[approval] ${payload.account} ${payload.slotId}`;
              if (process.env.ISSUE_TITLE !== expectedTitle) throw new Error('Approval issue title does not match its signed account/slot payload.');
            } else {
              payload.slotId = `${payload.account}:issue:${process.env.ISSUE_NUMBER}`;
            }
          } else {
            payload = {
              account: process.env.INPUT_ACCOUNT,
              text: process.env.INPUT_TEXT || '',
              mediaUrl: process.env.INPUT_MEDIA_URL || undefined,
              mediaType: process.env.INPUT_MEDIA_TYPE || 'image',
              dryRun: String(process.env.INPUT_DRY_RUN).toLowerCase() === 'true',
              source: 'manual',
              slotId: `${process.env.INPUT_ACCOUNT}:workflow:${process.env.RUN_ID}`
            };
          }
          writeFileSync('payload.json', JSON.stringify(payload));
          NODE

      - name: Runtime static guards
        run: |
          npm run validate
          npm run check
          npm run secret-scan

      - name: Publish
        id: publish_run
        env:
          CONVENIENCE_HUB_GITHUB_TOKEN: ${{ secrets.CONVENIENCE_HUB_GITHUB_TOKEN }}
          CONVENIENCE_HUB_REPOSITORY: ${{ vars.CONVENIENCE_HUB_REPOSITORY }}
          CONVENIENCE_HUB_PUBLIC_URL: ${{ vars.CONVENIENCE_HUB_PUBLIC_URL }}
          CONVENIENCE_HUB_BRANCH: ${{ vars.CONVENIENCE_HUB_BRANCH }}
        run: node src/publish.mjs --file payload.json

      - name: Persist published history/state and rotating OAuth2 state
        if: always() && steps.checkout.outcome == 'success' && steps.publish_run.outcome != 'skipped'
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- data/)" ]]; then
            echo "No state changes."
            exit 0
          fi

          git config user.name "sns-ai-bot"
          git config user.email "sns-ai-bot@users.noreply.github.com"
          git add data/
          git commit -m "chore: record SNS publish state"

          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "State push attempt ${attempt} failed; retrying..."
            sleep $((attempt * 3))
          done
          exit 1

      - name: Close command issue on success
        if: success() && github.event_name == 'issues'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "✅ Published successfully by SNS-AI."
          gh issue close "$ISSUE_NUMBER" --repo "$REPO"

      - name: Comment on command issue on failure
        if: failure() && github.event_name == 'issues'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body "❌ The publishing run failed or Hub backlink reconciliation is still pending. The provider may already have accepted the post if the failure happened during response/state/Hub persistence, so do not retry blindly. Re-running the same durable slot is safe: SNS-AI will reconcile the published claim and retry only unfinished bookkeeping instead of publishing the provider post again."

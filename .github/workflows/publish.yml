name: Publish social post

on:
  workflow_dispatch:
    inputs:
      account:
        description: Account ID from config/accounts.json
        required: true
        type: string
      text:
        description: Post text/caption
        required: false
        type: string
      media_url:
        description: Public HTTPS media URL (required by Instagram)
        required: false
        type: string
      media_type:
        description: image or reel
        required: false
        default: image
        type: choice
        options: [image, reel]
      dry_run:
        description: Validate without publishing
        required: false
        default: true
        type: boolean
      confirm_live:
        description: Must be true together with dry_run=false before one real provider post is allowed
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: sns-ai-write
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      INPUT_ACCOUNT: ${{ inputs.account }}
      INPUT_TEXT: ${{ inputs.text }}
      INPUT_MEDIA_URL: ${{ inputs.media_url }}
      INPUT_MEDIA_TYPE: ${{ inputs.media_type }}
      INPUT_DRY_RUN: ${{ inputs.dry_run }}
      INPUT_CONFIRM_LIVE: ${{ inputs.confirm_live }}

    steps:
      - name: Authorize command actor
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          EXTRA_ADMINS: ${{ vars.SNS_COMMAND_ADMINS }}
        shell: bash
        run: |
          normalized=",$(printf '%s' "${EXTRA_ADMINS:-}" | tr -d ' '),"
          if [[ "$ACTOR" != "$OWNER" && "$normalized" != *",$ACTOR,"* ]]; then
            echo "::error::Actor '$ACTOR' is not authorized to publish. Owner '$OWNER' or SNS_COMMAND_ADMINS is required."
            exit 1
          fi

      - uses: actions/checkout@v7
        id: checkout
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build explicitly manual payload
        env:
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const account = String(process.env.INPUT_ACCOUNT || '').trim();
          const dryRun = String(process.env.INPUT_DRY_RUN || 'true').toLowerCase() === 'true';
          const confirmLive = String(process.env.INPUT_CONFIRM_LIVE || 'false').toLowerCase() === 'true';
          if (!/^[A-Za-z0-9_.-]{1,80}$/.test(account)) throw new Error('A valid account id is required.');
          if (!dryRun && !confirmLive) throw new Error('Live publishing requires both dry_run=false and confirm_live=true.');
          const payload = {
            account,
            text: process.env.INPUT_TEXT || '',
            mediaUrl: process.env.INPUT_MEDIA_URL || undefined,
            mediaType: process.env.INPUT_MEDIA_TYPE || 'image',
            dryRun,
            source: 'manual',
            manualInvocation: true,
            slotId: `${account}:workflow:${process.env.RUN_ID}`
          };
          writeFileSync('payload.json', JSON.stringify(payload));
          NODE

      - name: Runtime static guards
        run: |
          npm run validate
          npm run check
          npm run secret-scan
          npm run manual-only-audit

      - name: Publish
        id: publish_run
        env:
          SNS_MANUAL_INVOCATION: 'true'
          SOCIAL_CREDENTIALS_JSON: ${{ secrets.SOCIAL_CREDENTIALS_JSON }}
          X_OAUTH2_STATE_KEY: ${{ secrets.X_OAUTH2_STATE_KEY }}
          CONVENIENCE_HUB_GITHUB_TOKEN: ${{ secrets.CONVENIENCE_HUB_GITHUB_TOKEN }}
          CONVENIENCE_HUB_REPOSITORY: ${{ vars.CONVENIENCE_HUB_REPOSITORY }}
          CONVENIENCE_HUB_PUBLIC_URL: ${{ vars.CONVENIENCE_HUB_PUBLIC_URL }}
          CONVENIENCE_HUB_BRANCH: ${{ vars.CONVENIENCE_HUB_BRANCH }}
        run: node src/publish.mjs --file payload.json

      - name: Persist published history/state and rotating OAuth2 state
        if: always() && steps.checkout.outcome == 'success' && steps.publish_run.outcome != 'skipped'
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- data/)" ]]; then
            echo "No state changes."
            exit 0
          fi

          git config user.name "sns-ai-bot"
          git config user.email "sns-ai-bot@users.noreply.github.com"
          git add data/
          git commit -m "chore: record SNS publish state"

          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "State push attempt ${attempt} failed; retrying..."
            sleep $((attempt * 3))
          done
          exit 1

      - name: Add run summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Manual SNS publish'
            echo
            echo "Account: \`$INPUT_ACCOUNT\`"
            echo "Dry run: \`$INPUT_DRY_RUN\`"
            if [[ "${INPUT_DRY_RUN:-true}" == "false" ]]; then
              echo 'A live provider mutation was explicitly requested by this workflow dispatch.'
            else
              echo 'No live provider mutation was requested.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

name: SNS Compliance Attestation

on:
  workflow_dispatch:
    inputs:
      account:
        description: Account ID from config/accounts.json
        required: true
        type: string
      kind:
        description: External X compliance fact being recorded
        required: true
        type: choice
        options: [x-profile, x-ai-reply]
      action:
        description: Record or revoke the attestation
        required: true
        default: revoke
        type: choice
        options: [confirm, revoke]
      confirmation:
        description: For confirm, enter the exact confirmation marker described in the run error/help text
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: sns-ai-write
  cancel-in-progress: false

jobs:
  attest:
    runs-on: ubuntu-latest
    env:
      INPUT_ACCOUNT: ${{ inputs.account }}
      INPUT_KIND: ${{ inputs.kind }}
      INPUT_ACTION: ${{ inputs.action }}
      INPUT_CONFIRMATION: ${{ inputs.confirmation }}

    steps:
      - name: Authorize command actor
        env:
          ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          EXTRA_ADMINS: ${{ vars.SNS_COMMAND_ADMINS }}
        shell: bash
        run: |
          normalized=",$(printf '%s' "${EXTRA_ADMINS:-}" | tr -d ' '),"
          if [[ "$ACTOR" != "$OWNER" && "$normalized" != *",$ACTOR,"* ]]; then
            echo "::error::Actor '$ACTOR' is not authorized to record compliance attestations."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Validate explicit attestation
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const account = String(process.env.INPUT_ACCOUNT || '').trim();
          const kind = String(process.env.INPUT_KIND || '').trim();
          const action = String(process.env.INPUT_ACTION || '').trim();
          const confirmation = String(process.env.INPUT_CONFIRMATION || '').trim();
          if (!/^[A-Za-z0-9_.-]{1,80}$/.test(account)) throw new Error('A valid account id is required.');
          if (!['x-profile', 'x-ai-reply'].includes(kind)) throw new Error('Unsupported compliance kind.');
          if (!['confirm', 'revoke'].includes(action)) throw new Error('Unsupported compliance action.');
          if (action === 'confirm') {
            const marker = kind === 'x-profile'
              ? 'I_CONFIRM_X_AUTOMATED_PROFILE_SETUP_COMPLETE=true'
              : 'I_CONFIRM_X_AI_REPLY_WRITTEN_APPROVAL_RECEIVED=true';
            if (confirmation !== marker) throw new Error(`Explicit external-compliance attestation is required. Enter exactly: ${marker}`);
          }
          NODE

      - name: Apply attestation in checkout
        shell: bash
        run: |
          args=(--account "$INPUT_ACCOUNT" --kind "$INPUT_KIND")
          if [[ "$INPUT_ACTION" == "confirm" ]]; then args+=(--confirm --confirmation "$INPUT_CONFIRMATION"); else args+=(--revoke); fi
          node src/ops/compliance-attestation.mjs "${args[@]}"

      - name: Validate fail-closed repository state
        run: |
          npm run validate
          npm run check
          npm run secret-scan
          npm run manual-only-audit

      - name: Persist attestation and any safety deactivation
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- config/accounts.json config/engagement-policy.json)" ]]; then
            echo "No compliance state change needed."
            exit 0
          fi
          git config user.name "sns-ai-bot"
          git config user.email "sns-ai-bot@users.noreply.github.com"
          git add config/accounts.json config/engagement-policy.json
          git commit -m "ops: ${INPUT_ACTION} ${INPUT_KIND} compliance for ${INPUT_ACCOUNT}"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 3))
          done
          exit 1

      - name: Report result
        if: success()
        run: echo "Recorded '$INPUT_ACTION' for '$INPUT_KIND' on '$INPUT_ACCOUNT'. This records only the owner's explicit attestation and performs no external X action."

name: SNS-AI CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sns-ai-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Focused Manual-Only policy
        run: node --test --test-concurrency=1 test/manual-only-policy.test.mjs
      - name: Focused provider mutation boundaries
        run: node --test --test-concurrency=1 test/manual-only-provider-boundary.test.mjs
      - name: Harness E-G
        run: node --import ./test/manual-invocation-harness.mjs --test --test-concurrency=1 test/e*.test.mjs test/f*.test.mjs test/g*.test.mjs
      - name: Harness I-M
        run: node --import ./test/manual-invocation-harness.mjs --test --test-concurrency=1 test/i*.test.mjs test/m*.test.mjs
      - name: Harness O-R
        run: node --import ./test/manual-invocation-harness.mjs --test --test-concurrency=1 test/o*.test.mjs test/p*.test.mjs test/r*.test.mjs
      - name: Harness S-X
        run: node --import ./test/manual-invocation-harness.mjs --test --test-concurrency=1 test/s*.test.mjs test/t*.test.mjs test/w*.test.mjs test/x*.test.mjs
      - name: Unit and integration tests
        run: npm test

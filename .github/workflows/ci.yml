name: SNS-AI CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sns-ai-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Focused test - Manual-Only policy
        run: node --test --test-concurrency=1 test/manual-only-policy.test.mjs
      - name: Focused test - Provider mutation boundaries
        run: node --test --test-concurrency=1 test/manual-only-provider-boundary.test.mjs
      - name: E1 engagement-audit-retention
        run: node --import ./test/manual-invocation-harness.mjs --test --test-concurrency=1 test/engagement-audit-retention.test.mjs
      - name: E2 engagement-autonomous-control
        run: node --import ./test/manual-invocation-harness.mjs --test --test-concurrency=1 test/engagement-autonomous-control.test.mjs
      - name: E3 engagement-autopilot
        run: node --import ./test/manual-invocation-harness.mjs --test --test-concurrency=1 test/engagement-autopilot.test.mjs
      - name: E4 engagement-delivery-ledger
        run: node --import ./test/manual-invocation-harness.mjs --test --test-concurrency=1 test/engagement-delivery-ledger.test.mjs
      - name: E5 engagement-optout-retention
        run: node --import ./test/manual-invocation-harness.mjs --test --test-concurrency=1 test/engagement-optout-retention.test.mjs
      - name: E6 engagement-pagination
        run: node --import ./test/manual-invocation-harness.mjs --test --test-concurrency=1 test/engagement-pagination.test.mjs
      - name: E7 engagement-policy-v4
        run: node --import ./test/manual-invocation-harness.mjs --test --test-concurrency=1 test/engagement-policy-v4.test.mjs
      - name: E8 engagement-preflight
        run: node --import ./test/manual-invocation-harness.mjs --test --test-concurrency=1 test/engagement-preflight.test.mjs
      - name: E9 engagement-runtime-e2e
        run: node --import ./test/manual-invocation-harness.mjs --test --test-concurrency=1 test/engagement-runtime-e2e.test.mjs
      - name: E10 engagement-workflow-state
        run: node --import ./test/manual-invocation-harness.mjs --test --test-concurrency=1 test/engagement-workflow-state.test.mjs
      - name: E11 experiment-brake-guardrails
        run: node --import ./test/manual-invocation-harness.mjs --test --test-concurrency=1 test/experiment-brake-guardrails.test.mjs
      - name: Unit and integration tests
        run: npm test

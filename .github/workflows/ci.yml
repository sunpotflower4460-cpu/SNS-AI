name: SNS-AI CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sns-ai-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Unit and integration tests
        run: npm test
      - name: Strict configuration validation
        run: npm run validate
      - name: Source syntax and import checks
        run: npm run check
      - name: Smoke checks
        run: npm run smoke
      - name: Secret scan
        run: npm run secret-scan
      - name: Manual-Only repository audit
        run: npm run manual-only-audit
      - name: Source coverage audit
        run: npm run coverage
      - name: Parse every workflow YAML
        run: |
          ruby -e 'require "yaml"; Dir[".github/workflows/*.{yml,yaml}"].each { |f| YAML.safe_load(File.read(f), aliases: true); puts "YAML OK: #{f}" }'
      - name: Key-safe configuration doctor
        run: npm run doctor
      - name: Keyless operational runtime checks
        run: |
          npm run report
          npm run weekly-report
          npm run maintenance
          npm run report

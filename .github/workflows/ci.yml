name: SNS-AI CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sns-ai-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit and integration checks
        run: |
          npm test
          npm run validate
          npm run check
          npm run smoke
      - name: Key-safe configuration doctor
        run: npm run doctor

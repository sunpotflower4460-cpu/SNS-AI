name: SNS Metrics Collector

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      account:
        description: Optional account ID
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: sns-ai-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      SOCIAL_CREDENTIALS_JSON: ${{ secrets.SOCIAL_CREDENTIALS_JSON }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      SNS_DURABLE_BUDGETS: 'true'
      SNS_DURABLE_STATE_BRANCH: sns-ai-state
      INPUT_ACCOUNT: ${{ inputs.account }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Runtime static guards
        run: |
          npm run validate
          npm run check
          npm run secret-scan
      - name: Collect due metrics
        id: metrics_run
        shell: bash
        run: |
          echo "did_work=false" >> "$GITHUB_OUTPUT"
          if [[ ! -s data/history.jsonl ]]; then
            echo "No published post history yet; nothing to collect."
            exit 0
          fi
          if [[ -z "${SOCIAL_CREDENTIALS_JSON:-}" ]]; then
            echo "SOCIAL_CREDENTIALS_JSON is not configured; skipping metrics collection."
            exit 0
          fi
          args=()
          if [[ -n "${INPUT_ACCOUNT:-}" ]]; then args+=(--account "$INPUT_ACCOUNT"); fi
          node src/analytics/collector.mjs "${args[@]}" | tee metrics-result.json
          if jq -e 'length > 0' metrics-result.json >/dev/null; then
            echo "did_work=true" >> "$GITHUB_OUTPUT"
          else
            echo "No due metrics or runtime events; skipping report refresh."
          fi
      - name: Refresh readable report
        if: steps.metrics_run.outcome == 'success' && steps.metrics_run.outputs.did_work == 'true'
        run: node src/reports/generate.mjs
      - name: Persist metrics/report
        if: always() && steps.metrics_run.outcome != 'skipped'
        shell: bash
        run: |
          rm -f metrics-result.json
          if [[ -z "$(git status --porcelain -- data/)" ]]; then exit 0; fi
          git config user.name "sns-ai-bot"
          git config user.email "sns-ai-bot@users.noreply.github.com"
          git add data/
          git commit -m "chore: persist SNS metrics"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 3))
          done
          exit 1

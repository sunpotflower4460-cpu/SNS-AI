name: SNS Human Feedback

on:
  workflow_dispatch:
    inputs:
      account:
        description: Account ID
        required: true
        type: string
      action:
        description: prefer, avoid, correct, pin, or note
        required: false
        default: note
        type: choice
        options: [prefer, avoid, correct, pin, note]
      note:
        description: Human feedback to remember
        required: true
        type: string
      dimension:
        description: Optional dimension such as hook/topic/format/mediaDecision
        required: false
        type: string
      value:
        description: Optional dimension value
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: sns-ai-write
  cancel-in-progress: false

jobs:
  feedback:
    runs-on: ubuntu-latest
    env:
      INPUT_ACCOUNT: ${{ inputs.account }}
      INPUT_ACTION: ${{ inputs.action }}
      INPUT_NOTE: ${{ inputs.note }}
      INPUT_DIMENSION: ${{ inputs.dimension }}
      INPUT_VALUE: ${{ inputs.value }}

    steps:
      - name: Authorize command actor
        env:
          ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          EXTRA_ADMINS: ${{ vars.SNS_COMMAND_ADMINS }}
        shell: bash
        run: |
          normalized=",$(printf '%s' "${EXTRA_ADMINS:-}" | tr -d ' '),"
          if [[ "$ACTOR" != "$OWNER" && "$normalized" != *",$ACTOR,"* ]]; then
            echo "::error::Actor '$ACTOR' is not authorized to change SNS-AI memory."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build feedback payload
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const account = String(process.env.INPUT_ACCOUNT || '').trim();
          const action = String(process.env.INPUT_ACTION || 'note').trim();
          const note = String(process.env.INPUT_NOTE || '');
          if (!/^[A-Za-z0-9_.-]{1,80}$/.test(account)) throw new Error('A valid account id is required.');
          if (!['prefer', 'avoid', 'correct', 'pin', 'note'].includes(action)) throw new Error('Unsupported feedback action.');
          if (!note.trim()) throw new Error('Feedback note is required.');
          writeFileSync('feedback.json', JSON.stringify({
            account,
            action,
            note,
            dimension: String(process.env.INPUT_DIMENSION || '').trim() || undefined,
            value: String(process.env.INPUT_VALUE || '').trim() || undefined,
            source: 'workflow-dispatch'
          }));
          NODE

      - name: Validate and record
        run: |
          npm run validate
          npm run check
          npm run secret-scan
          npm run manual-only-audit
          node src/feedback/record.mjs --file feedback.json

      - name: Persist feedback without rebase conflicts
        shell: bash
        run: |
          tail -n 1 data/human-feedback.jsonl > /tmp/sns-feedback-row.jsonl
          if [[ ! -s /tmp/sns-feedback-row.jsonl ]]; then
            echo "::error::Feedback recorder did not produce a JSONL row."
            exit 1
          fi

          git config user.name "sns-ai-bot"
          git config user.email "sns-ai-bot@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            touch data/human-feedback.jsonl

            if grep -Fqx -f /tmp/sns-feedback-row.jsonl data/human-feedback.jsonl; then
              echo "Feedback row is already persisted."
              exit 0
            fi

            cat /tmp/sns-feedback-row.jsonl >> data/human-feedback.jsonl
            git add data/human-feedback.jsonl
            git commit -m "data: record human SNS feedback"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Feedback push attempt ${attempt} lost a race; retrying from the latest remote state."
            sleep $((attempt * 3))
          done
          exit 1

      - name: Report result
        if: success()
        run: echo "Human feedback recorded for '$INPUT_ACCOUNT'."

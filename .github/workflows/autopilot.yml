name: SNS Autopilot

on:
  # Manual-only safety posture: no scheduled generation or publishing.
  workflow_dispatch:
    inputs:
      account:
        description: Optional account ID; leave blank for all accounts
        required: false
        type: string
      force:
        description: Generate now instead of waiting for a configured schedule slot
        required: false
        default: false
        type: boolean
      dry_run:
        description: Generate/validate without publishing or creating approval issues
        required: false
        default: true
        type: boolean
      confirm_live:
        description: Must be true together with dry_run=false before real provider publishing is allowed
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write

concurrency:
  group: sns-ai-write
  cancel-in-progress: false

jobs:
  autopilot:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      SOCIAL_CREDENTIALS_JSON: ${{ secrets.SOCIAL_CREDENTIALS_JSON }}
      X_OAUTH2_STATE_KEY: ${{ secrets.X_OAUTH2_STATE_KEY }}
      MEDIA_SERVICE_TOKEN: ${{ secrets.MEDIA_SERVICE_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      SNS_DURABLE_BUDGETS: 'true'
      SNS_DURABLE_STATE_BRANCH: sns-ai-state
      SNS_MANUAL_INVOCATION: 'true'
      INPUT_ACCOUNT: ${{ inputs.account }}
      INPUT_FORCE: ${{ inputs.force }}
      INPUT_DRY_RUN: ${{ inputs.dry_run }}
      INPUT_CONFIRM_LIVE: ${{ inputs.confirm_live }}

    steps:
      - name: Authorize command actor
        env:
          ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          EXTRA_ADMINS: ${{ vars.SNS_COMMAND_ADMINS }}
        shell: bash
        run: |
          normalized=",$(printf '%s' "${EXTRA_ADMINS:-}" | tr -d ' '),"
          if [[ "$ACTOR" != "$OWNER" && "$normalized" != *",$ACTOR,"* ]]; then
            echo "::error::Actor '$ACTOR' is not authorized to run SNS Autopilot."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Runtime static guards
        run: |
          npm run validate
          npm run check
          npm run secret-scan
          npm run manual-only-audit

      - name: Run autopilot
        id: autopilot_run
        shell: bash
        env:
          CONVENIENCE_HUB_GITHUB_TOKEN: ${{ secrets.CONVENIENCE_HUB_GITHUB_TOKEN }}
          CONVENIENCE_HUB_REPOSITORY: ${{ vars.CONVENIENCE_HUB_REPOSITORY }}
          CONVENIENCE_HUB_PUBLIC_URL: ${{ vars.CONVENIENCE_HUB_PUBLIC_URL }}
          CONVENIENCE_HUB_BRANCH: ${{ vars.CONVENIENCE_HUB_BRANCH }}
        run: |
          dry_run="${INPUT_DRY_RUN:-true}"
          confirm_live="${INPUT_CONFIRM_LIVE:-false}"
          if [[ "$dry_run" != "true" && "$confirm_live" != "true" ]]; then
            echo "::error::Live autopilot requires both dry_run=false and confirm_live=true."
            exit 1
          fi

          args=()
          if [[ -n "${INPUT_ACCOUNT:-}" ]]; then args+=(--account "$INPUT_ACCOUNT"); fi
          if [[ "${INPUT_FORCE:-false}" == "true" ]]; then args+=(--force); fi

          # Manual workflow runs default to dry-run=true. A live run requires an explicit dry_run=false
          # choice together with confirm_live=true (checked above).
          if [[ "$dry_run" == "true" ]]; then
            args+=(--dry-run)
          fi

          node src/orchestrate.mjs "${args[@]}"

      - name: Persist history/state
        if: always() && steps.autopilot_run.outcome != 'skipped'
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- data/)" ]]; then
            echo "No state changes."
            exit 0
          fi

          git config user.name "sns-ai-bot"
          git config user.email "sns-ai-bot@users.noreply.github.com"
          git add data/
          git commit -m "chore: persist SNS autopilot state"

          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "State push attempt ${attempt} failed; retrying..."
            sleep $((attempt * 3))
          done

          echo "Could not persist SNS state after retries."
          exit 1

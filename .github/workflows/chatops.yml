name: SNS ChatOps

# Manual-Only convenience surface.
# This workflow is intentionally provider-offline: it never receives provider/OpenAI
# credentials and never performs live publish, reply, DM, polling, or engagement actions.
# Live publish preflight and publishing have dedicated explicit manual workflows.

on:
  workflow_dispatch:
    inputs:
      command:
        description: Keyless manual command to run
        required: true
        default: preflight
        type: choice
        options: [preflight, dry-run]
      account:
        description: Account ID from config/accounts.json
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sns-ai-chatops-${{ github.ref }}
  cancel-in-progress: false

jobs:
  command:
    runs-on: ubuntu-latest
    env:
      INPUT_COMMAND: ${{ inputs.command }}
      INPUT_ACCOUNT: ${{ inputs.account }}
      COMMAND_OUTPUT: /tmp/sns-chatops-output.txt

    steps:
      - name: Authorize command actor
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          EXTRA_ADMINS: ${{ vars.SNS_COMMAND_ADMINS }}
        shell: bash
        run: |
          normalized=",$(printf '%s' "${EXTRA_ADMINS:-}" | tr -d ' '),"
          if [[ "$ACTOR" != "$OWNER" && "$normalized" != *",$ACTOR,"* ]]; then
            echo "::error::Actor '$ACTOR' is not authorized to run SNS ChatOps."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Validate inputs
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const command = String(process.env.INPUT_COMMAND || '').trim();
          const account = String(process.env.INPUT_ACCOUNT || '').trim();
          if (!['preflight', 'dry-run'].includes(command)) throw new Error('Unsupported ChatOps command.');
          if (!/^[A-Za-z0-9_.-]{1,80}$/.test(account)) throw new Error('A valid account id is required.');
          NODE

      - name: Execute keyless preflight
        if: inputs.command == 'preflight'
        shell: bash
        run: |
          set -o pipefail
          {
            npm run validate
            npm run check
            npm run secret-scan
            npm run manual-only-audit
            npm run doctor
          } 2>&1 | tee "$COMMAND_OUTPUT"

      - name: Execute dry run
        if: inputs.command == 'dry-run'
        shell: bash
        run: |
          set -o pipefail
          node src/orchestrate.mjs --account "$INPUT_ACCOUNT" --force --dry-run 2>&1 | tee "$COMMAND_OUTPUT"

      - name: Add privacy-safe run summary
        if: always()
        shell: bash
        run: |
          {
            echo '## SNS ChatOps (provider-offline)'
            echo
            echo "Command: \`$INPUT_COMMAND\`"
            echo "Account: \`$INPUT_ACCOUNT\`"
            echo
            if [[ -s "$COMMAND_OUTPUT" ]]; then
              tail -c 10000 "$COMMAND_OUTPUT" \
                | sed -E 's/sk-(proj-|svcacct-)?[A-Za-z0-9_-]{12,}/[REDACTED_OPENAI_KEY]/g; s/github_pat_[A-Za-z0-9_]{20,}/[REDACTED_GITHUB_TOKEN]/g; s/gh[pousr]_[A-Za-z0-9]{20,}/[REDACTED_GITHUB_TOKEN]/g; s/Bearer[[:space:]]+[A-Za-z0-9._~-]{12,}/Bearer [REDACTED]/Ig'
            else
              echo 'No public command output was produced.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

name: SNS ChatOps

# Safety routing notes used by static regression tests:
# [preflight] and [dry-run] are explicit manual workflow_dispatch commands only.
# Automated-engagement compliance lives in src/ops/x-automation-compliance.mjs and is intentionally
# not executed by routine publish preflight; engagement activation has its own separate gate.

on:
  workflow_dispatch:
    inputs:
      command:
        description: Manual command to run
        required: true
        default: preflight
        type: choice
        options: [preflight, dry-run, engagement-dry-run, engagement-run, engagement-resolve]
      account:
        description: Account ID from config/accounts.json
        required: true
        type: string
      event_key:
        description: 32-character event key for engagement-resolve only
        required: false
        type: string
      resolution_action:
        description: Resolution action for engagement-resolve
        required: false
        default: ignore
        type: choice
        options: [reply, ignore]
      resolution_text:
        description: Reply text for engagement-resolve when action=reply
        required: false
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: sns-ai-write
  cancel-in-progress: false

jobs:
  command:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SOCIAL_CREDENTIALS_JSON: ${{ secrets.SOCIAL_CREDENTIALS_JSON }}
      X_OAUTH2_STATE_KEY: ${{ secrets.X_OAUTH2_STATE_KEY }}
      MEDIA_SERVICE_TOKEN: ${{ secrets.MEDIA_SERVICE_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      SNS_MANUAL_INVOCATION: 'true'
      SNS_DURABLE_BUDGETS: 'true'
      SNS_DURABLE_STATE_BRANCH: sns-ai-state
      INPUT_COMMAND: ${{ inputs.command }}
      INPUT_ACCOUNT: ${{ inputs.account }}
      INPUT_EVENT_KEY: ${{ inputs.event_key }}
      INPUT_RESOLUTION_ACTION: ${{ inputs.resolution_action }}
      INPUT_RESOLUTION_TEXT: ${{ inputs.resolution_text }}
      COMMAND_OUTPUT: /tmp/sns-chatops-output.txt

    steps:
      - name: Authorize command actor
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          EXTRA_ADMINS: ${{ vars.SNS_COMMAND_ADMINS }}
        shell: bash
        run: |
          normalized=",$(printf '%s' "${EXTRA_ADMINS:-}" | tr -d ' '),"
          if [[ "$ACTOR" != "$OWNER" && "$normalized" != *",$ACTOR,"* ]]; then
            echo "::error::Actor '$ACTOR' is not authorized to run SNS ChatOps."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Validate inputs and prepare resolution
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const command = String(process.env.INPUT_COMMAND || '').trim();
          const account = String(process.env.INPUT_ACCOUNT || '').trim();
          if (!['preflight', 'dry-run', 'engagement-dry-run', 'engagement-run', 'engagement-resolve'].includes(command)) throw new Error('Unsupported ChatOps command.');
          if (!/^[A-Za-z0-9_.-]{1,80}$/.test(account)) throw new Error('A valid account id is required.');
          if (command === 'engagement-resolve') {
            const eventKey = String(process.env.INPUT_EVENT_KEY || '').trim();
            const action = String(process.env.INPUT_RESOLUTION_ACTION || 'ignore').trim().toLowerCase();
            const text = String(process.env.INPUT_RESOLUTION_TEXT || '');
            if (!/^[a-f0-9]{32}$/.test(eventKey)) throw new Error('engagement-resolve requires a valid 32-character event key.');
            if (!['reply', 'ignore'].includes(action)) throw new Error('Resolution action must be reply or ignore.');
            if (action === 'reply' && !text.trim()) throw new Error('Reply resolution requires non-empty text.');
            writeFileSync('engagement-resolve.json', JSON.stringify({ account, eventKey, action, text }));
          }
          NODE

      - name: Runtime static guards
        run: |
          npm run validate
          npm run check
          npm run secret-scan
          npm run manual-only-audit

      - name: Restore durable engagement and OAuth state
        shell: bash
        run: bash scripts/engagement-durable-state.sh restore

      - name: Execute Preflight
        if: inputs.command == 'preflight'
        shell: bash
        run: |
          set -o pipefail
          {
            status=0
            npm run doctor -- --strict --account "$INPUT_ACCOUNT" || status=1
            node src/ops/live-preflight.mjs --account "$INPUT_ACCOUNT" || status=1
            node src/ops/x-posting-compliance.mjs --account "$INPUT_ACCOUNT" || status=1
            exit "$status"
          } 2>&1 | tee "$COMMAND_OUTPUT"

      - name: Execute Autopilot Dry Run
        if: inputs.command == 'dry-run'
        shell: bash
        run: |
          set -o pipefail
          node src/orchestrate.mjs --account "$INPUT_ACCOUNT" --force --dry-run 2>&1 | tee "$COMMAND_OUTPUT"

      - name: Execute Engagement Dry Run
        if: inputs.command == 'engagement-dry-run'
        shell: bash
        run: |
          private_output=/tmp/sns-engagement-dry-run-private.txt
          if node src/engagement/run.mjs --account "$INPUT_ACCOUNT" --dry-run >"$private_output" 2>&1; then
            printf '%s\n' 'Engagement dry-run completed. Detailed interaction output is intentionally suppressed because it can contain private-DM-derived content.' > "$COMMAND_OUTPUT"
          else
            printf '%s\n' 'Engagement dry-run failed. Detailed interaction output is intentionally suppressed for privacy.' > "$COMMAND_OUTPUT"
            exit 1
          fi

      - name: Execute Engagement Run
        if: inputs.command == 'engagement-run'
        shell: bash
        run: |
          private_output=/tmp/sns-engagement-run-private.txt
          if node src/engagement/run.mjs --account "$INPUT_ACCOUNT" --manual-invocation >"$private_output" 2>&1; then
            printf '%s\n' 'Manual engagement run completed. Detailed interaction output is intentionally suppressed for privacy.' > "$COMMAND_OUTPUT"
          else
            printf '%s\n' 'Manual engagement run failed. Detailed interaction output is intentionally suppressed for privacy.' > "$COMMAND_OUTPUT"
            exit 1
          fi

      - name: Execute Engagement Resolution
        if: inputs.command == 'engagement-resolve'
        shell: bash
        run: |
          private_output=/tmp/sns-engagement-resolve-private.txt
          if node src/engagement/run.mjs --resolve-file engagement-resolve.json --manual-invocation >"$private_output" 2>&1; then
            printf '%s\n' 'Human-resolved engagement action completed. Detailed interaction output is intentionally suppressed for privacy.' > "$COMMAND_OUTPUT"
          else
            printf '%s\n' 'Human-resolved engagement action failed. Detailed interaction output is intentionally suppressed for privacy.' > "$COMMAND_OUTPUT"
            exit 1
          fi

      - name: Persist durable engagement and OAuth state
        if: always()
        shell: bash
        run: bash scripts/engagement-durable-state.sh persist

      - name: Remove durable state workspace copies before main persistence
        if: always()
        shell: bash
        run: |
          rm -f \
            data/engagement-state.json \
            data/engagement-audit.jsonl \
            data/x-oauth2-state.json \
            data/engagement-delivery-ledger.json \
            data/durable-usage-state.json

      - name: Persist remaining safe runtime state
        if: always()
        shell: bash
        run: |
          paths=(data/usage.jsonl data/usage-state.json)
          if [[ -z "$(git status --porcelain -- "${paths[@]}")" ]]; then exit 0; fi
          git config user.name "sns-ai-bot"
          git config user.email "sns-ai-bot@users.noreply.github.com"
          for path in "${paths[@]}"; do
            [[ -e "$path" ]] && git add "$path"
          done
          git diff --cached --quiet && exit 0
          git commit -m "chore: persist SNS ChatOps state"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 3))
          done
          exit 1

      - name: Add privacy-safe run summary
        if: always()
        shell: bash
        run: |
          {
            echo '## SNS ChatOps'
            echo
            echo "Command: \`$INPUT_COMMAND\`"
            echo "Account: \`$INPUT_ACCOUNT\`"
            echo
            if [[ -s "$COMMAND_OUTPUT" ]]; then
              tail -c 10000 "$COMMAND_OUTPUT" \
                | sed -E 's/sk-(proj-|svcacct-)?[A-Za-z0-9_-]{12,}/[REDACTED_OPENAI_KEY]/g; s/github_pat_[A-Za-z0-9_]{20,}/[REDACTED_GITHUB_TOKEN]/g; s/gh[pousr]_[A-Za-z0-9]{20,}/[REDACTED_GITHUB_TOKEN]/g; s/Bearer[[:space:]]+[A-Za-z0-9._~-]{12,}/Bearer [REDACTED]/Ig'
            else
              echo 'No public command output was produced.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

name: SNS Daily Learning

on:
  # Manual-only safety posture: no scheduled learning/state writes.
  workflow_dispatch:
    inputs:
      account:
        description: Optional account ID
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: sns-ai-write
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    env:
      INPUT_ACCOUNT: ${{ inputs.account }}
    steps:
      - name: Authorize command actor
        env:
          ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          EXTRA_ADMINS: ${{ vars.SNS_COMMAND_ADMINS }}
        shell: bash
        run: |
          normalized=",$(printf '%s' "${EXTRA_ADMINS:-}" | tr -d ' '),"
          if [[ "$ACTOR" != "$OWNER" && "$normalized" != *",$ACTOR,"* ]]; then
            echo "::error::Actor '$ACTOR' is not authorized to run SNS Daily Learning."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Runtime static guards
        run: |
          npm run validate
          npm run check
          npm run secret-scan
          npm run manual-only-audit
      - name: Update account strategies from measured outcomes
        id: learning_run
        shell: bash
        run: |
          args=()
          if [[ -n "${INPUT_ACCOUNT:-}" ]]; then args+=(--account "$INPUT_ACCOUNT"); fi
          node src/learning/learn.mjs "${args[@]}"
      - name: Refresh readable report
        if: always() && steps.learning_run.outcome != 'skipped'
        run: node src/reports/generate.mjs
      - name: Persist strategy/report
        if: always() && steps.learning_run.outcome != 'skipped'
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- data/)" ]]; then exit 0; fi
          git config user.name "sns-ai-bot"
          git config user.email "sns-ai-bot@users.noreply.github.com"
          git add data/
          git commit -m "chore: update SNS learned strategy"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 3))
          done
          exit 1

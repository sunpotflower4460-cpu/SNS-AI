name: SNS Health Report

on:
  schedule:
    - cron: '17 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sns-ai-write
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SOCIAL_CREDENTIALS_JSON: ${{ secrets.SOCIAL_CREDENTIALS_JSON }}
      X_OAUTH2_STATE_KEY: ${{ secrets.X_OAUTH2_STATE_KEY }}
      MEDIA_SERVICE_TOKEN: ${{ secrets.MEDIA_SERVICE_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Runtime static guards
        run: |
          npm run validate
          npm run check
          npm run secret-scan
      - name: Generate readiness report
        id: health_run
        run: npm run doctor -- --write
      - name: Report stuck durable publish claims
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run stale-claims
      - name: Persist readiness only when it changed
        if: always() && steps.health_run.outcome != 'skipped'
        run: |
          if [[ -z "$(git status --porcelain -- data/reports/readiness.json data/reports/readiness.md)" ]]; then
            echo "Readiness unchanged."
            exit 0
          fi
          git config user.name "sns-ai-bot"
          git config user.email "sns-ai-bot@users.noreply.github.com"
          git add data/reports/readiness.json data/reports/readiness.md
          git commit -m "data: update SNS readiness report"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 3))
          done
          exit 1

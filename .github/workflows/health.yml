name: SNS Health Report

on:
  # Manual-only safety posture: health checks do not run on a timer.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sns-ai-write
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SOCIAL_CREDENTIALS_JSON: ${{ secrets.SOCIAL_CREDENTIALS_JSON }}
      X_OAUTH2_STATE_KEY: ${{ secrets.X_OAUTH2_STATE_KEY }}
      MEDIA_SERVICE_TOKEN: ${{ secrets.MEDIA_SERVICE_TOKEN }}
    steps:
      - name: Authorize command actor
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          EXTRA_ADMINS: ${{ vars.SNS_COMMAND_ADMINS }}
        shell: bash
        run: |
          normalized=",$(printf '%s' "${EXTRA_ADMINS:-}" | tr -d ' '),"
          if [[ "$ACTOR" != "$OWNER" && "$normalized" != *",$ACTOR,"* ]]; then
            echo "::error::Actor '$ACTOR' is not authorized to run SNS Health Report."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Runtime static guards
        run: |
          npm run validate
          npm run check
          npm run secret-scan
      - name: Generate readiness report
        id: health_run
        # --strict is what makes this job actually able to fail. Without it, doctor always exits 0, so
        # a readiness BLOCKER (expired/revoked credential, missing secret, a deprecated media backend)
        # left this daily job green and Failure Watch never opened an issue - the alarm could not ring.
        # The "Persist readiness only when it changed" step below is `if: always()`, so the report is
        # still committed on a failing run and the operator can see exactly which blocker fired.
        run: npm run doctor -- --write --strict
      - name: Report stuck durable publish claims
        # This is an independent diagnostic, not dependent on the preceding steps' outcomes - a
        # persistent config/static-check failure (or a readiness-report failure) must not silently
        # suppress the one thing that surfaces slots stuck in publishing/publish_unknown, precisely on
        # the days the health job is already unhealthy and most needs visibility.
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run stale-claims
      - name: Persist readiness only when it changed
        if: always() && steps.health_run.outcome != 'skipped'
        run: |
          if [[ -z "$(git status --porcelain -- data/reports/readiness.json data/reports/readiness.md)" ]]; then
            echo "Readiness unchanged."
            exit 0
          fi
          git config user.name "sns-ai-bot"
          git config user.email "sns-ai-bot@users.noreply.github.com"
          git add data/reports/readiness.json data/reports/readiness.md
          git commit -m "data: update SNS readiness report"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 3))
          done
          exit 1

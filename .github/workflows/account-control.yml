name: SNS Account Control

on:
  workflow_dispatch:
    inputs:
      account:
        description: Account ID from config/accounts.json
        required: true
        type: string
      target:
        description: Lifecycle target. Manual-Only blocks approval/auto until runtime policy is reviewed.
        required: true
        default: disabled
        type: choice
        options: [approval, auto, pause, disabled]

permissions:
  contents: write

concurrency:
  group: sns-ai-write
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-latest
    env:
      INPUT_ACCOUNT: ${{ inputs.account }}
      INPUT_TARGET: ${{ inputs.target }}

    steps:
      - name: Authorize command actor
        env:
          ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          EXTRA_ADMINS: ${{ vars.SNS_COMMAND_ADMINS }}
        shell: bash
        run: |
          normalized=",$(printf '%s' "${EXTRA_ADMINS:-}" | tr -d ' '),"
          if [[ "$ACTOR" != "$OWNER" && "$normalized" != *",$ACTOR,"* ]]; then
            echo "::error::Actor '$ACTOR' is not authorized for account lifecycle changes."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Validate lifecycle inputs
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const account = String(process.env.INPUT_ACCOUNT || '').trim();
          const target = String(process.env.INPUT_TARGET || '').trim();
          if (!/^[A-Za-z0-9_.-]{1,80}$/.test(account)) throw new Error('A valid account id is required.');
          if (!['approval', 'auto', 'pause', 'disabled'].includes(target)) throw new Error('Unsupported lifecycle target.');
          NODE

      - name: Apply lifecycle transition in checkout
        run: node src/ops/account-control.mjs --account "$INPUT_ACCOUNT" --target "$INPUT_TARGET"

      - name: Static safety checks
        run: |
          npm run validate
          npm run check
          npm run secret-scan
          npm run manual-only-audit

      - name: Live account preflight before enabling publishing
        if: inputs.target == 'approval' || inputs.target == 'auto'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          SOCIAL_CREDENTIALS_JSON: ${{ secrets.SOCIAL_CREDENTIALS_JSON }}
          X_OAUTH2_STATE_KEY: ${{ secrets.X_OAUTH2_STATE_KEY }}
          MEDIA_SERVICE_TOKEN: ${{ secrets.MEDIA_SERVICE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SNS_DURABLE_STATE_BRANCH: sns-ai-state
          SNS_REQUIRE_DURABLE_STATE: 'true'
          CONVENIENCE_HUB_GITHUB_TOKEN: ${{ secrets.CONVENIENCE_HUB_GITHUB_TOKEN }}
          CONVENIENCE_HUB_REPOSITORY: ${{ vars.CONVENIENCE_HUB_REPOSITORY }}
          CONVENIENCE_HUB_PUBLIC_URL: ${{ vars.CONVENIENCE_HUB_PUBLIC_URL }}
          CONVENIENCE_HUB_BRANCH: ${{ vars.CONVENIENCE_HUB_BRANCH }}
        run: node src/ops/live-preflight.mjs --account "$INPUT_ACCOUNT"

      - name: Persist account lifecycle change
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- config/accounts.json)" ]]; then
            echo "No account config change needed."
            exit 0
          fi
          git config user.name "sns-ai-bot"
          git config user.email "sns-ai-bot@users.noreply.github.com"
          git add config/accounts.json
          git commit -m "ops: set ${INPUT_ACCOUNT} lifecycle to ${INPUT_TARGET}"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 3))
          done
          exit 1

      - name: Report result
        if: success()
        run: echo "SNS-AI account '$INPUT_ACCOUNT' lifecycle request '$INPUT_TARGET' completed after safety gates."

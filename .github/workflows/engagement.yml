name: SNS Engagement Autopilot

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
    inputs:
      account:
        description: Optional account ID; leave blank for all allowlisted enabled accounts
        required: false
        type: string
      dry_run:
        description: Classify and draft without sending or persisting terminal actions
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write

concurrency:
  group: sns-ai-write
  cancel-in-progress: false

jobs:
  engagement:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SOCIAL_CREDENTIALS_JSON: ${{ secrets.SOCIAL_CREDENTIALS_JSON }}
      X_OAUTH2_STATE_KEY: ${{ secrets.X_OAUTH2_STATE_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      SNS_DURABLE_STATE_BRANCH: sns-ai-state
      INPUT_ACCOUNT: ${{ inputs.account }}
      INPUT_DRY_RUN: ${{ inputs.dry_run }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Runtime static guards
        run: |
          npm run validate
          npm run check
          npm run secret-scan

      - name: Restore durable engagement state
        shell: bash
        run: |
          set -euo pipefail
          state_branch="${SNS_DURABLE_STATE_BRANCH:-sns-ai-state}"
          paths=(data/engagement-state.json data/engagement-audit.jsonl data/x-oauth2-state.json)

          if ! git ls-remote --exit-code --heads origin "$state_branch" >/dev/null 2>&1; then
            live_count="$(node -e "const p=require('./config/engagement-policy.json'); console.log(Array.isArray(p.liveAccounts) ? p.liveAccounts.length : 0)")"
            if [[ "$live_count" != "0" ]]; then
              echo "Durable state branch '$state_branch' is missing while live engagement is enabled. Run Live Preflight/setup before activation."
              exit 1
            fi
            echo "Durable state branch '$state_branch' is not present yet; no live engagement accounts are active, so continuing without restored state."
            exit 0
          fi

          git fetch --no-tags origin "refs/heads/${state_branch}:refs/remotes/origin/${state_branch}"
          for path in "${paths[@]}"; do
            if git cat-file -e "refs/remotes/origin/${state_branch}:${path}" 2>/dev/null; then
              mkdir -p "$(dirname "$path")"
              git show "refs/remotes/origin/${state_branch}:${path}" > "$path"
              echo "Restored $path from $state_branch."
            else
              rm -f "$path"
            fi
          done

      - name: Ensure human-escalation label
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create needs-human --description 'SNS-AI requires a human decision' --color B60205 --force

      - name: Run engagement autopilot
        id: engagement_run
        shell: bash
        run: |
          args=()
          if [[ -n "${INPUT_ACCOUNT:-}" ]]; then args+=(--account "$INPUT_ACCOUNT"); fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${INPUT_DRY_RUN:-false}" == "true" ]]; then args+=(--dry-run); fi
          node src/engagement/run.mjs "${args[@]}"

      - name: Persist privacy-safe engagement state to durable branch
        if: always() && steps.engagement_run.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          state_branch="${SNS_DURABLE_STATE_BRANCH:-sns-ai-state}"
          paths=(data/engagement-state.json data/engagement-audit.jsonl data/x-oauth2-state.json)

          if ! git ls-remote --exit-code --heads origin "$state_branch" >/dev/null 2>&1; then
            changed=false
            for path in "${paths[@]}"; do
              [[ -e "$path" ]] && changed=true
            done
            if [[ "$changed" == "false" ]]; then
              echo "No engagement state exists to persist and durable state branch is not ready."
              exit 0
            fi
            echo "Durable state branch '$state_branch' is missing; refusing to persist runtime state to main."
            exit 1
          fi

          git fetch --no-tags origin "refs/heads/${state_branch}:refs/remotes/origin/${state_branch}"
          state_worktree="$(mktemp -d)"
          cleanup() {
            git worktree remove --force "$state_worktree" >/dev/null 2>&1 || true
            rm -rf "$state_worktree"
          }
          trap cleanup EXIT

          git worktree add --detach "$state_worktree" "refs/remotes/origin/${state_branch}"
          (
            cd "$state_worktree"
            git switch -C "$state_branch" "refs/remotes/origin/${state_branch}"
            git config user.name "sns-ai-bot"
            git config user.email "sns-ai-bot@users.noreply.github.com"

            for path in "${paths[@]}"; do
              source_path="${GITHUB_WORKSPACE}/${path}"
              if [[ -e "$source_path" ]]; then
                mkdir -p "$(dirname "$path")"
                cp "$source_path" "$path"
              else
                rm -f "$path"
              fi
            done

            for path in "${paths[@]}"; do
              git add -A -- "$path"
            done
            if git diff --cached --quiet; then
              echo "No durable engagement state changes."
              exit 0
            fi

            git commit -m "chore: persist SNS engagement state"
            for attempt in 1 2 3; do
              if git pull --rebase origin "$state_branch" && git push origin "HEAD:${state_branch}"; then
                exit 0
              fi
              echo "Durable state push attempt ${attempt} failed; retrying..."
              sleep $((attempt * 3))
            done
            echo "Could not persist engagement state to $state_branch after retries."
            exit 1
          )

name: SNS Engagement Autopilot

on:
  workflow_dispatch:
    inputs:
      account:
        description: Optional account ID; leave blank for all allowlisted enabled accounts
        required: false
        type: string
      dry_run:
        description: Classify and draft without sending or persisting terminal actions
        required: false
        default: true
        type: boolean
      confirm_live:
        description: Must be true together with dry_run=false before real engagement sends are allowed
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write

concurrency:
  group: sns-ai-write
  cancel-in-progress: false

jobs:
  engagement:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SOCIAL_CREDENTIALS_JSON: ${{ secrets.SOCIAL_CREDENTIALS_JSON }}
      X_OAUTH2_STATE_KEY: ${{ secrets.X_OAUTH2_STATE_KEY }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      # Only workflow_dispatch may receive the explicit-manual-invocation credential. A future
      # schedule: trigger must NOT inherit SNS_MANUAL_INVOCATION, or unattended cron would bypass
      # assertProviderMutationAllowed the same way a human dispatch does.
      SNS_MANUAL_INVOCATION: ${{ github.event_name == 'workflow_dispatch' && 'true' || '' }}
      SNS_DURABLE_BUDGETS: 'true'
      SNS_DURABLE_STATE_BRANCH: sns-ai-state
      INPUT_ACCOUNT: ${{ inputs.account }}
      INPUT_DRY_RUN: ${{ inputs.dry_run }}
      INPUT_CONFIRM_LIVE: ${{ inputs.confirm_live }}

    steps:
      - name: Authorize command actor
        env:
          ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
          EXTRA_ADMINS: ${{ vars.SNS_COMMAND_ADMINS }}
        shell: bash
        run: |
          normalized=",$(printf '%s' "${EXTRA_ADMINS:-}" | tr -d ' '),"
          if [[ "$ACTOR" != "$OWNER" && "$normalized" != *",$ACTOR,"* ]]; then
            echo "::error::Actor '$ACTOR' is not authorized to run engagement automation."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Runtime static guards
        run: |
          npm run validate
          npm run check
          npm run secret-scan
          npm run manual-only-audit

      # The shared helper restores/persists only privacy-safe engagement runtime files, including
      # data/engagement-state.json and data/engagement-audit.jsonl, on sns-ai-state rather than main.
      - name: Restore durable engagement state
        shell: bash
        run: bash scripts/engagement-durable-state.sh restore

      - name: Ensure human-escalation label
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create needs-human --description 'SNS-AI requires a human decision' --color B60205 --force

      - name: Run engagement autopilot
        id: engagement_run
        shell: bash
        run: |
          dry_run="${INPUT_DRY_RUN:-true}"
          confirm_live="${INPUT_CONFIRM_LIVE:-false}"
          if [[ "$dry_run" != "true" && "$confirm_live" != "true" ]]; then
            echo "::error::Live engagement requires both dry_run=false and confirm_live=true."
            exit 1
          fi

          args=()
          if [[ -n "${INPUT_ACCOUNT:-}" ]]; then args+=(--account "$INPUT_ACCOUNT"); fi
          if [[ "$dry_run" == "true" ]]; then args+=(--dry-run); fi
          node src/engagement/run.mjs --manual-invocation "${args[@]}"

      - name: Persist privacy-safe engagement state to durable branch
        if: always() && steps.engagement_run.outcome != 'skipped'
        shell: bash
        run: bash scripts/engagement-durable-state.sh persist

name: SNS Engagement Scheduled

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sns-ai-write
  cancel-in-progress: false

jobs:
  manual-only-notice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Verify Manual-Only posture
        run: |
          npm run validate
          npm run manual-only-audit

      - name: Explain scheduled engagement lock
        run: |
          {
            echo '## Scheduled engagement is disabled in Manual-Only'
            echo
            echo 'This workflow intentionally performs no provider polling, replies, or DMs.'
            echo 'Use SNS Engagement Autopilot with its default dry_run=true for a manually dispatched inspection.'
            echo 'Re-enabling scheduled engagement requires a separate reviewed change to the runtime policy and workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
